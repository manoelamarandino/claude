name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages. No build tooling — the app is
# plain HTML/CSS/JS, so this just gathers the runtime files and uploads them.

on:
  push:
    branches: ["claude/research-triage-matrix-9cy3dt"]
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-flight one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r src _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true # turn Pages on via the API if it isn't already
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
